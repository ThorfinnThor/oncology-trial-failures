name: Append Batch 18 audit

on:
  push:
    branches:
      - audit/batch-18

permissions:
  contents: write

jobs:
  append-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/batch-18
          fetch-depth: 0
      - name: Append Batch 18 section once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '# Classification Audit — Batch 18' docs/classification_audit.md; then
            echo 'Batch 18 section already present; nothing to do.'
            exit 0
          fi
          printf '\n\n' >> docs/classification_audit.md
          cat docs/.batch18_section.md >> docs/classification_audit.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/classification_audit.md
          git commit -m 'docs: add classification audit batch 18'
          git push origin HEAD:audit/batch-18
