name: Prepare audit batch 8

on:
  pull_request:
    branches:
      - audit/batch-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Merge audit docs and extract records 1401-1600
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          main_path = Path('docs/classification_audit.md')
          parts = [main_path.read_text(encoding='utf-8').rstrip()]

          headings = {
              6: '## Batch 6 — records 1001–1200',
              7: '## Batch 7 — records 1201–1400',
          }

          merged_any = False
          for batch_no in (6, 7):
              path = Path(f'docs/classification_audit_batch{batch_no}.md')
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').strip()
              lines = text.splitlines()
              if not lines:
                  raise RuntimeError(f'{path} is empty')
              lines[0] = headings[batch_no]
              parts.append('\n'.join(lines))
              path.unlink()
              merged_any = True

          if merged_any:
              merged = '\n\n---\n\n'.join(parts).rstrip() + '\n'
              main_path.write_text(merged, encoding='utf-8')

          data_path = Path('data/all_oncology_stopped_trials.json')
          records = json.loads(data_path.read_text(encoding='utf-8'))
          selected = records[1400:1600]
          if len(selected) != 200:
              raise RuntimeError(f'Expected 200 Batch 8 records, got {len(selected)}')

          slim = []
          for record_number, record in enumerate(selected, start=1401):
              slim.append({
                  'record_number': record_number,
                  'nct_id': record.get('nct_id') or record.get('nctId') or record.get('nct_number') or record.get('id'),
                  'why_stopped': record.get('why_stopped'),
                  'classification_label': record.get('classification_label'),
                  'classification_reason': record.get('classification_reason'),
                  'classification_confidence': record.get('classification_confidence'),
              })

          out_path = Path('audit_batch8_records_1401_1600.json')
          out_path.write_text(json.dumps(slim, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'Extracted {len(slim)} records.')
          print(f'Batch 8 boundary: {slim[0]["nct_id"]} -> {slim[-1]["nct_id"]}')
          PY

      - name: Commit merged audit docs when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/classification_audit.md docs/classification_audit_batch6.md docs/classification_audit_batch7.md
          if git diff --cached --quiet; then
            echo "Audit docs already merged."
          else
            git commit -m "Merge audit batches 6 and 7"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload Batch 8 audit input
        uses: actions/upload-artifact@v4
        with:
          name: audit-batch8-records-1401-1600
          path: audit_batch8_records_1401_1600.json
          retention-days: 1
