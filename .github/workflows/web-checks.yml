name: Website checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # styled-jsx silently drops a rule put on a <Link>; nothing else catches it.
      - run: npm run check:styles
      # A page importing the paid packages would give them away with no visible symptom.
      - run: npm run check:private
      # Keep the committed default report-only and fail if the reviewed URL scope expands accidentally.
      - run: npm run check:seo-release
      - run: npm test
      - run: npm run build:cloudflare

  # The rules that read free text (why a trial stopped, whose data stopped it) are checked on every
  # push, before the weekly run would publish anything built with them. MISTAKES.md #15.
  text-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/signals/check_text_readers.py
      - run: python scripts/signals/run_signals_tests.py
      - run: python scripts/review/run_review_tests.py
