name: Apply Batch 10 audit documentation

on:
  push:
    branches:
      - audit/batch-10
    paths:
      - docs/.classification_audit_batch10.tmp.md
      - .github/workflows/audit-batch10-append.yml

permissions:
  contents: write

concurrency:
  group: audit-batch10-append
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/batch-10
          fetch-depth: 0

      - name: Append audit section and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          section='docs/.classification_audit_batch10.tmp.md'
          workflow='.github/workflows/audit-batch10-append.yml'

          test -f "$section"
          cat "$section" >> docs/classification_audit.md
          git rm -- "$section" "$workflow"
          git add -- docs/classification_audit.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'docs: add classification audit batch 10'
          git push origin HEAD:audit/batch-10
