name: Update oncology trial failure data

on:
  schedule:
    # Runs every Monday at 06:15 UTC (free). Change anytime.
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- NEW: Golden tests step ---
      - name: Run golden tests
        run: |
          python scripts/run_golden_tests.py

      - name: Fetch data
        run: |
          python scripts/fetch_ctgov_oncology_failures.py
        env:
          MAX_STUDIES_TOTAL: "20000"
          LAST_UPDATE_FROM: "2015-01-01"
          PAGE_SIZE: "100"
          SLEEP_SECONDS: "1.3"
          OVERRIDES_PATH: "overrides.csv"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json overrides.csv || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update oncology trial failure dataset"
          git push
