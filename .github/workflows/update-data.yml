name: Apply Batch 10 audit documentation

on:
  push:
    branches:
      - audit/batch-10

permissions:
  contents: write

concurrency:
  group: audit-batch10-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/batch-10
          fetch-depth: 0

      - name: Append audit section and remove all staging artifacts
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin audit/batch-3:refs/remotes/origin/audit/batch-3

          test "$(git hash-object docs/classification_audit.md)" = "9df80d1b1fa6a82ac664d31d694920a94df8a2a6"
          test -f docs/.classification_audit_batch10.tmp.md

          cat docs/.classification_audit_batch10.tmp.md >> docs/classification_audit.md

          git rm -- \
            docs/.classification_audit_batch10.tmp.md \
            .github/workflows/audit-batch10-append.yml \
            web/scripts/audit-batch10-doc-hash.cjs

          git show origin/audit/batch-3:web/package.json > web/package.json
          git show origin/audit/batch-3:.github/workflows/update-data.yml > .github/workflows/update-data.yml

          git add -- \
            docs/classification_audit.md \
            web/package.json \
            .github/workflows/update-data.yml

          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add classification audit batch 10"
          git push origin HEAD:audit/batch-10
