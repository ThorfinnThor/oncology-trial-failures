name: Update trial failure data

on:
  schedule:
    - cron: "15 6 * * 1" # Monday 06:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden tests
        run: |
          python scripts/run_golden_tests.py

      - name: Fetch data
        run: |
          python scripts/fetch_ctgov_oncology_failures.py
        env:
          MAX_STUDIES_TOTAL: "50000"
          LAST_UPDATE_FROM: "2015-01-01"
          PAGE_SIZE: "100"
          SLEEP_SECONDS: "1.2"
          OVERRIDES_PATH: "overrides.csv"

      - name: Publish dataset to web/public
        run: |
          python scripts/publish_public_assets.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.csv data/*.json overrides.csv || true
          git add web/public/*.json web/public/*.csv || true

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update trial dataset"
          git push
