name: Update trial failure data

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden tests
        run: |
          python scripts/run_golden_tests.py

      - name: Fetch data (no artificial cap)
        run: |
          python scripts/fetch_ctgov_oncology_failures.py
        env:
          # MAX_STUDIES_TOTAL intentionally omitted (script default is 50000)
          LAST_UPDATE_FROM: "2015-01-01"
          PAGE_SIZE: "100"
          SLEEP_SECONDS: "1.3"
          OVERRIDES_PATH: "overrides.csv"

      - name: Publish public assets (web/public/*.json + dataset_meta.json)
        run: |
          python scripts/publish_public_assets.py

      - name: Sync dataset into web/public/data (compat)
        run: |
          mkdir -p web/public/data
          rm -rf web/public/data/*
          cp -r data/* web/public/data/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/* web/public/data/* web/public/*.json overrides.csv || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update trial failure dataset"
          git push
