name: Update trial failure data

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild reviewed-reason index
        run: |
          python scripts/build_reviewed_reason_index_v2.py

      - name: Run Classification V2 tests and quality gate
        run: |
          python scripts/run_golden_tests.py
          python scripts/run_classification_v2_tests.py
          python scripts/run_pipeline_integrity_tests.py
          python scripts/evaluate_classification_v2.py --enforce

      - name: Fetch data (no artificial cap)
        run: |
          cp data/all_stopped_trials.json "$RUNNER_TEMP/pre_ingest_all_stopped_trials.json"
          python scripts/fetch_ctgov_oncology_failures.py
        env:
          # MAX_STUDIES_TOTAL intentionally omitted (script default is 50000)
          LAST_UPDATE_FROM: "2015-01-01"
          PAGE_SIZE: "100"
          SLEEP_SECONDS: "1.3"
          OVERRIDES_PATH: "overrides.csv"
          REVIEWED_REASONS_V2_PATH: "data/classification_reviewed_reasons_v2.json"

      # The fetch re-derives description fallbacks from live registry text, but
      # the reviewed proposal artifact is frozen, so any change to the snippet
      # extraction or the rules silently puts the two out of step and only the
      # snapshot validation below notices.  Refresh recomputes the reviewed set
      # against the same text the fetch just read.  It only ever recomputes
      # proposals that were already reviewed; discovering new ones stays manual.
      - name: Refresh reviewed context proposals against the fetched snapshot
        run: |
          python scripts/enrich_classification_context_v2.py --refresh-existing --write

      - name: Build V2 review queue and canonical subsets
        run: |
          python scripts/reclassify_dataset_v2.py --write

      - name: Validate Classification V2 snapshot invariants
        run: |
          python scripts/validate_classification_v2_snapshot.py

      - name: Rebuild change report from the final classified snapshot
        run: |
          python scripts/ingest_changes.py --previous "$RUNNER_TEMP/pre_ingest_all_stopped_trials.json"

      - name: Publish public assets (web/public/*.json + dataset_meta.json)
        run: |
          python scripts/publish_public_assets.py

      - name: Sync dataset into web/public/data (compat)
        run: |
          mkdir -p web/public/data
          rm -rf web/public/data/*
          for file in data/*; do
            case "$(basename "$file")" in
              classification_*) continue ;;
            esac
            cp -r "$file" web/public/data/
          done

      - name: Rebuild compact trial index and Cloudflare shards
        working-directory: web
        run: |
          node scripts/generate-data-shards.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data overrides.csv web/public/data
          git add web/public/all_stopped_trials.csv web/public/all_stopped_trials.json
          git add web/public/biological_failure_trials.csv web/public/biological_failure_trials.json
          git add web/public/dataset_meta.json web/public/ingest_changes.json
          git add web/public/specialness_index.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update trial failure dataset"
          git push

      # The gate between the text-reading rules and anything a customer sees (MISTAKES.md #15:
      # "not due to safety concerns" was shown as a safety stop). Deliberately NOT
      # continue-on-error: if it fails, no report, brief or newsletter is rebuilt this week, the
      # published ones stay as they were, and GitHub emails the owner that the run failed.
      - name: Text-reader gate
        run: |
          python scripts/signals/check_text_readers.py

      # A second, independent reader: a language model reads every new stop reason each week and,
      # once a month, every stop reason that feeds a rate or a report (scripts/review/llm_review.py).
      # Runs only when the repository secret ANTHROPIC_API_KEY exists; without it nothing is sent.
      # The model may fill in or dispute "whose data stopped this trial"; it never changes a rate by
      # itself — outcome disagreements are listed in data/llm_review/outcome_disagreements.md.
      # Model: repository variable REVIEW_MODEL (default claude-sonnet-5-5). Cost cap per run:
      # REVIEW_MAX_USD (default 15). continue-on-error: an API outage must not stop the weekly data.
      - name: Independent review of stop reasons
        id: llm_review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_MAX_USD: ${{ vars.REVIEW_MAX_USD }}
        run: |
          python scripts/review/llm_review.py run --wait-minutes 45

      # Readings are paid for: committed straight away, so a later failing step cannot lose them.
      - name: Commit review readings
        if: always()
        run: |
          git add data/llm_review data/attribution_reviewed.json
          git diff --cached --quiet && echo "No review changes" && exit 0
          git commit -m "Independent review of stop reasons"
          git pull --rebase --autostash origin main || true
          git push

      # ---------------------------------------------------------------------------
      # Oncology Failure Signals enrichment (commercial dataset). Runs after the
      # classified dataset has been committed, so an outage of an external source
      # never blocks the weekly registry update.
      # ---------------------------------------------------------------------------
      - name: Restore enrichment cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/signals
            .cache/universe
          key: signals-${{ github.run_id }}
          restore-keys: signals-

      - name: Build Oncology Failure Signals
        id: signals
        continue-on-error: true
        env:
          SIGNALS_CONTACT: ${{ secrets.SIGNALS_CONTACT }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python scripts/signals/run_signals_tests.py
          # Exit code 3 = time budget reached; the cache is saved below and the next run resumes.
          python -u scripts/signals/build_oncology_failure_signals.py --step all --max-seconds 9000 --workers 6
          # Diffs against the snapshot in .cache/signals, then refreshes it for the next run.
          python scripts/signals/build_change_report.py

      - name: Build trial universe and discontinuation rates
        id: discontinuation_rates
        continue-on-error: true
        run: |
          python scripts/universe/run_universe_tests.py
          python -u scripts/universe/fetch_universe.py --max-seconds 2400
          python -u scripts/universe/chembl_index.py
          python -u scripts/universe/ncit_index.py
          python -u scripts/universe/resolve.py
          # The other half of the evidence: trials that ran to the end and missed. Before the
          # briefs, which carry the count as a second number; resumable by year slice, and every
          # consumer degrades to "no endpoint section" rather than failing if it has not run.
          # From 2010, because the stopped-trial pages carry the posted result too and many of
          # those trials started before 2015.
          python -u scripts/universe/endpoint_outcomes.py --start-year 2010 --max-seconds 1500 || true
          python -u scripts/universe/discontinuation_rates.py --tables --pack --start 2015:2024
          python -u scripts/briefs/build_brief_catalog.py
          # Every curated area beyond oncology, read from the lexicon rather than listed here. This
          # loop once named three areas while the lexicon had four, and the fourth — its brief and
          # its one sellable package — quietly left the site at the next weekly run.
          python -c "from scripts.universe.mechanism_classes import CURATED_AREAS; print('\n'.join(a for a in CURATED_AREAS if a != 'Oncology'))" > .cache/areas.txt
          cat .cache/areas.txt
          while IFS= read -r area; do
            python -u scripts/universe/discontinuation_rates.py --tables --pack --start 2015:2024 --area "$area"
            python -u scripts/briefs/build_brief_catalog.py --area "$area"
          done < .cache/areas.txt
          cp .cache/universe/resolution_report.json product/discontinuation_rates/

      - name: Render discontinuation-rate briefs to PDF
        if: steps.discontinuation_rates.outcome == 'success'
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python -u scripts/briefs/render_brief_pdfs.py --workers 4

      # Separate from rendering, so a failed PDF render cannot leave last week's briefs online —
      # and a brief whose cohort no longer qualifies is removed rather than left standing with text
      # built under old rules (check_generated_text.py reads every file here before the commit).
      - name: Publish briefs
        if: steps.discontinuation_rates.outcome == 'success'
        run: |
          mkdir -p web/public/briefs
          if ls product/briefs/brief_*.html >/dev/null 2>&1; then
            rm -f web/public/briefs/brief_*.html
            # The web version is published too: a brief is marketing, not a gated asset.
            cp product/briefs/brief_*.html web/public/briefs/
          fi
          # The website serves the PDFs behind the lead form on /briefs/<slug>. Replaced only when
          # this run rendered them; otherwise last week's stay rather than none.
          if ls product/briefs/*.pdf >/dev/null 2>&1; then
            rm -f web/public/briefs/*.pdf
            cp product/briefs/*.pdf web/public/briefs/
          fi

      # The public summary reads the rate pack and counts the briefs, so it is built after
      # those steps. Run inside the signals step it wrote a summary with no rate figures,
      # and the licensing page rendered "—" for every rate.
      - name: Build public product summary and sample
        if: steps.signals.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/signals/build_public_sample.py
          python scripts/briefs/build_briefs_index.py
          python scripts/build_validation_public.py
          python scripts/universe/cohort_flow.py
          python scripts/universe/reporting_quality.py
          # What the posted results say, for every stopped trial that has a page on the site.
          python scripts/universe/publish_trial_endpoints.py || true
          # The home page's four ways a trial ends, each with one real record picked by rule.
          python scripts/universe/build_home_outcomes.py || true
          # Every package exists before anyone orders one: delivery is a lookup, not a job.
          python scripts/signals/build_evidence_catalog.py
          # The watchlist page offers terms that occur in this release, so a pick can always match.
          python scripts/signals/build_watch_terms.py
          # Delivery resolves the buyer's own molecule from this, so it must not depend on ChEMBL
          # being reachable at the moment somebody opens a package they paid for.
          python scripts/signals/build_asset_index.py
          # What we know about every mechanism class, not only the ones with a published brief:
          # a rate needs enough closed trials, naming the molecules that failed does not.
          python scripts/signals/build_class_signatures.py
          # Resumable and cached: a full run only fetches descriptions for newly unreadable
          # terminations, so this costs a handful of API calls in a normal week.
          python scripts/signals/event_ascertainment.py --fetch --budget 120 || true
          python scripts/signals/event_ascertainment.py || true

      - name: Save enrichment cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/signals
            .cache/universe
          key: signals-${{ github.run_id }}

      - name: Upload Oncology Failure Signals release
        if: steps.signals.outcome == 'success' || steps.discontinuation_rates.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: oncology-failure-signals-${{ github.run_id }}
          path: product/
          retention-days: 90

      - name: Commit public product summary and sample
        if: steps.signals.outcome == 'success'
        run: |
          # Every report, brief and sample is read as a customer would before it is committed: no
          # "1 stops", "NaN", "None of the 0", unfilled placeholders, and the free brief and the paid
          # report on one cohort must state the same numbers. A failure here stops the commit, so the
          # previous, checked versions stay online, and GitHub emails the owner.
          python scripts/check_generated_text.py
          # Last week's verdicts, for next week's determinism check; and the reviewed diff when the
          # rules were changed on purpose.
          python scripts/signals/check_text_readers.py --write-snapshot
          git add data/attribution_snapshot.json
          [ -f data/attribution_changes.md ] && git add data/attribution_changes.md
          git add -A web/data/product_summary.json web/data/briefs_index.json web/data/validation_v2.json web/data/cohort_flow.json web/data/reporting_quality.json web/data/event_ascertainment.json web/data/evidence_catalogue.json web/data/watch_terms.json web/data/private web/public/samples web/public/briefs web/public/trial_endpoints.json web/data/home_outcomes.json
          git diff --cached --quiet && echo "No product summary changes" && exit 0
          git commit -m "Update product summary, sample and briefs"
          git push

      # Each report's whole cohort as CSV, read by /api/report-export for buyers. Only after the
      # checks above passed (an implicit success() guards this step), so an export never runs
      # ahead of the report it belongs to. Kept in Workers KV, not in this public repository.
      - name: Upload full cohort exports
        if: steps.signals.outcome == 'success'
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python scripts/signals/upload_exports.py

      # ---------------------------------------------------------------------------
      # The fortnightly newsletter. Last, because it tells people about a release
      # that is already published: a mail pointing at a page that does not exist
      # yet is worse than a late mail. Every run folds this release's changes into
      # what is waiting; a mail goes out only when twelve days have passed since
      # the last one. Without BREVO_API_KEY nothing is sent and the mail is
      # uploaded as an artifact instead, so the content can be read before anyone
      # signs up to a sending service.
      # ---------------------------------------------------------------------------
      - name: Newsletter
        if: steps.signals.outcome == 'success'
        continue-on-error: true
        env:
          # Two secrets and no more: the KV namespace is read from web/wrangler.jsonc and the
          # account from the token itself. The token needs Workers KV read and write, because
          # what is waiting to be mailed is kept there between runs.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python scripts/signals/newsletter.py

      - name: Upload the newsletter for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: product/newsletter/
          if-no-files-found: ignore
          retention-days: 30
